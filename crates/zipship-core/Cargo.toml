[package]
name = "zipship-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
directories = "5"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

