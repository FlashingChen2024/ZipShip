<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feFlood flood-color="rgba(0,0,0,0.4)"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect x="40" y="40" width="432" height="432" rx="96" fill="#1E293B" stroke="#334155" stroke-width="12"/>
  
  <!-- Z Shape with Tech details -->
  <path d="M150 150H320L360 150H390" stroke="#FB923C" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  
  <path d="M160 170H340L170 340H350" stroke="url(#grad1)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" filter="url(#dropShadow)"/>
  
  <!-- Zipper Teeth Indicators -->
  <path d="M235 240L265 240" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
  <path d="M245 270L275 270" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>

  <!-- Speed Accents -->
  <path d="M390 120L420 90" stroke="#FB923C" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M420 120L450 90" stroke="#FB923C" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  
  <path d="M90 420L120 390" stroke="#FB923C" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M60 420L90 390" stroke="#FB923C" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>